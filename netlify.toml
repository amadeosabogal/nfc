# Netlify — publica la carpeta /public.
# Opción A (sin build): arrastra la carpeta "public" a https://app.netlify.com/drop
# Opción B (con build): conecta el repositorio; Netlify ejecuta "node build.mjs".

[build]
  command = "node build.mjs"
  publish = "public"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# main.js se versiona con ?v=hash, por eso puede cachearse un año
[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
